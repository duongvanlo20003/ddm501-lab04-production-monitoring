[pytest]
testpaths = tests
python_files = test_*.py
addopts =
    -v
    --strict-markers
    --tb=short
    # Coverage is scoped to app/ deliberately. pipeline/ belongs to Labs 2 and
    # 3 and is tested there; measuring it here would report a misleading
    # number that nobody could act on.
    --cov=app
    --cov-report=term-missing
    --cov-fail-under=85
markers =
    slow: takes more than a few seconds
filterwarnings =
    ignore::DeprecationWarning
