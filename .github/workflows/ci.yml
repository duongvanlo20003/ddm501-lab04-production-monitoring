name: CI

on:
  push:
    branches: [main, master]
  pull_request:
  workflow_dispatch:

env:
  PYTHON_VERSION: "3.11"

jobs:
  # ---------------------------------------------------------------------------
  config:
    name: Prometheus configuration
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install promtool
        run: |
          VERSION=2.51.2
          curl -sSL -o prom.tar.gz \
            "https://github.com/prometheus/prometheus/releases/download/v${VERSION}/prometheus-${VERSION}.linux-amd64.tar.gz"
          tar xzf prom.tar.gz
          sudo mv "prometheus-${VERSION}.linux-amd64/promtool" /usr/local/bin/

      - name: Check rule syntax
        run: promtool check rules monitoring/prometheus/alerts/*.yml

      - name: Unit-test the alert rules
        # Feeds synthetic time series through the rule evaluator and asserts
        # which alerts fire and when. This is the step that catches a `for:`
        # window that can never elapse.
        working-directory: monitoring/prometheus/tests
        run: promtool test rules alert_tests.yml

      - name: Check the compose file
        run: docker compose config --quiet

  # ---------------------------------------------------------------------------
  test:
    name: Tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip

      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Generate the dataset
        run: python scripts/make_dataset.py

      - name: Train the model
        run: python scripts/train_model.py

      - name: Build the drift reference
        run: python scripts/make_reference.py

      - name: Run the suite
        run: pytest

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: coverage
          path: |
            .coverage
            coverage.xml
          if-no-files-found: ignore

  # ---------------------------------------------------------------------------
  stack:
    name: The stack comes up and Prometheus scrapes it
    runs-on: ubuntu-latest
    needs: [config, test]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Build the model the image needs
        run: |
          pip install -r requirements.txt
          python scripts/make_dataset.py
          python scripts/train_model.py
          python scripts/make_reference.py

      - name: Start the stack
        run: docker compose up -d --build

      - name: Wait for the API to be healthy
        run: |
          for i in $(seq 1 30); do
            if curl -sf localhost:8000/health > /dev/null; then
              echo "healthy after ${i}s"; exit 0
            fi
            sleep 1
          done
          docker compose logs api
          exit 1

      - name: Generate traffic
        run: python scripts/load_test.py --profile normal --requests 250 --delay 0

      - name: Prometheus is scraping the API
        # The end-to-end assertion: a metric produced by the service has
        # arrived in Prometheus. A green unit-test suite proves the metric is
        # exported; only this proves it is collected.
        run: |
          sleep 15
          UP=$(curl -sf "localhost:9090/api/v1/query?query=up%7Bjob%3D%22credit-risk-api%22%7D" \
               | python -c "import json,sys; print(json.load(sys.stdin)['data']['result'][0]['value'][1])")
          echo "up = $UP"
          test "$UP" = "1"

      - name: The drift metric has reached Prometheus
        run: |
          COUNT=$(curl -sf "localhost:9090/api/v1/query?query=ml_drift_window_size" \
                  | python -c "import json,sys; print(len(json.load(sys.stdin)['data']['result']))")
          test "$COUNT" -ge 1

      - name: Show the logs on failure
        if: failure()
        run: docker compose logs

      - name: Tear down
        if: always()
        run: docker compose down -v
