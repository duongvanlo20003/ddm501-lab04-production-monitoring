<svg xmlns="http://www.w3.org/2000/svg" width="690" height="412" viewBox="0 0 690 412"><defs><marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#1D315F"/></marker><marker id="ah-rev" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#1D315F"/></marker></defs><rect width="100%" height="100%" fill="#FFFFFF"/><rect x="125" y="40" width="250" height="74" rx="4" fill="#EDF1F7" stroke="#1D315F" stroke-width="1.4"/><text x="250" y="70" font-family="Arial, Helvetica, sans-serif" font-size="15" fill="#1D315F" text-anchor="middle" font-weight="bold" font-style="normal">FastAPI</text><text x="250" y="90" font-family="Arial, Helvetica, sans-serif" font-size="11" fill="#595959" text-anchor="middle" font-weight="normal" font-style="normal">+ instrumentation</text><text x="401" y="66" font-family="Consolas, 'Courier New', monospace" font-size="11.5" fill="#595959" text-anchor="start" font-weight="normal" font-style="normal">/predict   /explain</text><text x="401" y="83" font-family="Consolas, 'Courier New', monospace" font-size="11.5" fill="#595959" text-anchor="start" font-weight="normal" font-style="normal">/metrics   /monitoring</text><rect x="125" y="165" width="250" height="74" rx="4" fill="#EDF1F7" stroke="#1D315F" stroke-width="1.4"/><text x="250" y="207" font-family="Arial, Helvetica, sans-serif" font-size="15" fill="#1D315F" text-anchor="middle" font-weight="bold" font-style="normal">Prometheus</text><text x="401" y="191" font-family="Arial, Helvetica, sans-serif" font-size="11.5" fill="#595959" text-anchor="start" font-weight="normal" font-style="normal">stores the series,</text><text x="401" y="208" font-family="Arial, Helvetica, sans-serif" font-size="11.5" fill="#595959" text-anchor="start" font-weight="normal" font-style="normal">evaluates 12 alert rules</text><rect x="125" y="290" width="250" height="74" rx="4" fill="#EDF1F7" stroke="#1D315F" stroke-width="1.4"/><text x="250" y="332" font-family="Arial, Helvetica, sans-serif" font-size="15" fill="#1D315F" text-anchor="middle" font-weight="bold" font-style="normal">Grafana</text><text x="401" y="331" font-family="Arial, Helvetica, sans-serif" font-size="11.5" fill="#595959" text-anchor="start" font-weight="normal" font-style="normal">2 provisioned dashboards</text><line x1="250" y1="118" x2="250" y2="159" stroke="#1D315F" stroke-width="1.4" marker-end="url(#ah)"/><text x="262" y="143.5" font-family="Arial, Helvetica, sans-serif" font-size="11" fill="#1F4E79" text-anchor="start" font-weight="normal" font-style="normal">scraped every 10s</text><line x1="250" y1="243" x2="250" y2="284" stroke="#1D315F" stroke-width="1.4" marker-end="url(#ah)"/><text x="262" y="268.5" font-family="Arial, Helvetica, sans-serif" font-size="11" fill="#1F4E79" text-anchor="start" font-weight="normal" font-style="normal">queried with PromQL</text><line x1="60" y1="77" x2="119" y2="77" stroke="#F17225" stroke-width="1.6" marker-end="url(#ah)"/><text x="58" y="69" font-family="Arial, Helvetica, sans-serif" font-size="11.5" fill="#F17225" text-anchor="end" font-weight="bold" font-style="normal">traffic</text><text x="345" y="396" font-family="Arial, Helvetica, sans-serif" font-size="10.5" fill="#595959" text-anchor="middle" font-weight="normal" font-style="italic">No IP address anywhere: Docker's embedded DNS resolves the service names</text></svg>